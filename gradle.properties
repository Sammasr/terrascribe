# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter-name overlay for Minecraft sources (improves IDE readability of MC code).
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge versions.
# Latest: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.228
neo_version_range=[21.1.0,)
loader_version_range=[4,)

## Mod Properties
mod_id=terrascribe
mod_name=TerraScribe
mod_license=MIT
mod_version=0.0.1-alpha
mod_group_id=io.github.sammasr.terrascribe
mod_authors=sammasr
mod_description=TerraScribe is a terrain generation overhaul for Minecraft 1.21.1. It replaces vanilla worldgen with a simulated-erosion heightmap, flow-based rivers, climate-driven biome assignment, and a live in-game preview that lets you sculpt the world before generating it. Built as a spiritual successor to TerraForged and ReTerraForged, with full modded-biome compatibility.
