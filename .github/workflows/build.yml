name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew build test --stacktrace

      - name: Upload mod jars
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terrascribe-jars
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
